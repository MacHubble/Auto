<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Libretto Auto">
<title>Libretto Auto — Garage & Manutenzioni</title>
<style>
  :root {
    --bg: #f2f4f8;
    --card: #ffffff;
    --text: #111827;
    --muted: #6b7280;
    --border: #e5e7eb;
    --primary: #1d4ed8;
    --primary-light: #eff6ff;
    --ok-bg: #dcfce7;
    --ok-txt: #15803d;
    --warn-bg: #fef3c7;
    --warn-txt: #b45309;
    --bad-bg: #fee2e2;
    --bad-txt: #b91c1c;
    --radius: 18px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; }
  body { margin: 0; background: var(--bg); color: var(--text); padding-bottom: 40px; }
  
  /* Header */
  header {
    position: sticky; top: 0; z-index: 30;
    background: rgba(255,255,255,0.88); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 14px 18px;
    padding-top: max(14px, env(safe-area-inset-top));
    display: flex; align-items: center; justify-content: space-between;
  }
  .header-title { font-size: 20px; font-weight: 800; letter-spacing: -0.3px; }
  .header-sub { font-size: 12px; color: var(--muted); }
  .btn {
    border: none; border-radius: 12px; padding: 10px 14px; font-size: 14px; font-weight: 600;
    cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    transition: transform 0.1s, opacity 0.15s;
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-secondary { background: #e5e7eb; color: var(--text); }
  .btn-ghost { background: transparent; color: var(--primary); padding: 6px 10px; }
  .btn-danger { background: var(--bad-bg); color: var(--bad-txt); }
  .btn-sm { padding: 7px 11px; font-size: 13px; border-radius: 10px; }
  .btn-block { width: 100%; padding: 13px; font-size: 15px; }

  .container { max-width: 560px; margin: 0 auto; padding: 16px; }

  /* Empty State */
  .empty-garage {
    background: var(--card); border-radius: 24px; padding: 44px 24px; text-align: center;
    margin-top: 28px; box-shadow: 0 4px 20px rgba(0,0,0,0.04); border: 1px solid var(--border);
  }
  .empty-icon {
    width: 76px; height: 76px; border-radius: 24px; background: var(--primary-light); color: var(--primary);
    display: flex; align-items: center; justify-content: center; margin: 0 auto 18px; font-size: 36px;
  }
  .empty-garage h2 { margin: 0 0 8px; font-size: 21px; }
  .empty-garage p { margin: 0 0 24px; color: var(--muted); font-size: 14px; line-height: 1.5; }

  /* Garage Cards */
  .car-card {
    background: var(--card); border-radius: 22px; padding: 16px 18px; margin-bottom: 14px;
    box-shadow: 0 3px 14px rgba(0,0,0,0.04); border: 1px solid var(--border);
    cursor: pointer; transition: transform 0.12s;
  }
  .car-card:active { transform: scale(0.985); }
  .car-card-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .car-avatar-box {
    width: 150px; height: 72px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
  }
  .car-info { flex: 1; min-width: 0; }
  .car-name { font-size: 18px; font-weight: 800; margin: 0 0 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  
  /* Italian Plate */
  .plate {
    display: inline-flex; align-items: stretch; border: 1.5px solid #1f2937; border-radius: 5px;
    overflow: hidden; background: #fff; height: 24px; font-family: "Courier New", monospace; font-weight: 800;
  }
  .plate-band {
    background: #003399; color: #fff; width: 14px; font-size: 8px; display: flex;
    flex-direction: column; align-items: center; justify-content: space-between; padding: 2px 0;
  }
  .plate-num { padding: 0 7px; font-size: 13px; letter-spacing: 1px; display: flex; align-items: center; color: #111; }

  .car-card-footer {
    margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between; font-size: 13px;
  }
  .badge {
    padding: 4px 9px; border-radius: 999px; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; gap: 4px;
  }
  .badge-ok { background: var(--ok-bg); color: var(--ok-txt); }
  .badge-warn { background: var(--warn-bg); color: var(--warn-txt); }
  .badge-bad { background: var(--bad-bg); color: var(--bad-txt); }

  /* Detail View */
  .hero-card {
    background: var(--card); border-radius: 22px; padding: 18px; margin-bottom: 16px;
    border: 1px solid var(--border); box-shadow: 0 3px 14px rgba(0,0,0,0.04);
  }
  .hero-avatar { width: 100%; max-width: 280px; height: 115px; margin: 4px auto 10px; display: flex; align-items: center; justify-content: center; }
  .km-box {
    background: #f8fafc; border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px;
    display: flex; align-items: center; justify-content: space-between; margin-top: 12px;
  }
  .km-val { font-size: 20px; font-weight: 800; }

  .section-head {
    display: flex; align-items: center; justify-content: space-between; margin: 20px 2px 10px;
  }
  .section-head h3 { margin: 0; font-size: 16px; font-weight: 800; }

  .item-card {
    background: var(--card); border-radius: 16px; padding: 14px 16px; margin-bottom: 10px;
    border: 1px solid var(--border);
  }
  .item-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .item-title { font-weight: 700; font-size: 15px; margin: 0 0 3px; }
  .item-meta { font-size: 12.5px; color: var(--muted); }

  /* Tabs inside Detail */
  .tabs {
    display: flex; background: #e5e7eb; padding: 4px; border-radius: 14px; margin-bottom: 16px;
  }
  .tab {
    flex: 1; border: none; background: transparent; padding: 9px; border-radius: 10px;
    font-size: 14px; font-weight: 700; color: var(--muted); cursor: pointer;
  }
  .tab.active { background: #fff; color: var(--text); box-shadow: 0 1px 4px rgba(0,0,0,0.08); }

  /* Modals */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(17,24,39,0.55); z-index: 50;
    display: none; align-items: flex-end; justify-content: center;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    background: #fff; width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto;
    border-radius: 24px 24px 0 0; padding: 20px 18px 32px;
    animation: slideUp 0.2s ease-out;
  }
  @media (min-width: 600px) {
    .modal-backdrop { align-items: center; }
    .modal { border-radius: 24px; }
  }
  @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

  .modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .modal-head h3 { margin: 0; font-size: 18px; }
  .close-btn { background: #f3f4f6; border: none; width: 32px; height: 32px; border-radius: 50%; font-size: 18px; cursor: pointer; }

  .form-group { margin-bottom: 14px; }
  label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 6px; color: #374151; }
  input, select, textarea {
    width: 100%; padding: 11px 12px; border: 1.5px solid var(--border); border-radius: 12px;
    font-size: 15px; background: #fff; color: var(--text);
  }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); }
  .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  /* Color Swatches */
  .swatches { display: flex; flex-wrap: wrap; gap: 10px; }
  .swatch {
    width: 34px; height: 34px; border-radius: 50%; border: 2px solid #d1d5db; cursor: pointer;
    position: relative;
  }
  .swatch.selected { border: 3px solid var(--primary); transform: scale(1.1); }

  /* Avatar Preview Box */
  .preview-box {
    background: linear-gradient(180deg, #f8fafc 0%, #eef2f6 100%);
    border: 1px solid var(--border); border-radius: 16px; padding: 10px;
    display: flex; flex-direction: column; align-items: center; margin-bottom: 14px;
  }
  .preview-box svg { width: 240px; height: 98px; }

  .receipt-thumb {
    width: 100%; max-height: 160px; object-fit: cover; border-radius: 10px; margin-top: 8px; border: 1px solid var(--border);
  }
  .backup-bar {
    margin-top: 28px; padding-top: 16px; border-top: 1px solid var(--border);
    display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;
  }
</style>
</head>
<body>

<header id="app-header"></header>
<main class="container" id="app-main"></main>

<!-- MODAL VEICOLO -->
<div class="modal-backdrop" id="modal-car">
  <div class="modal">
    <div class="modal-head">
      <h3 id="modal-car-title">Aggiungi Auto</h3>
      <button class="close-btn" onclick="closeModal('modal-car')">&times;</button>
    </div>
    <form id="form-car" onsubmit="saveCar(event)">
      <input type="hidden" id="car-id">
      <div class="preview-box">
        <div id="car-svg-preview"></div>
        <span style="font-size:11px; color:#6b7280; margin-top:2px;">Anteprima veicolo</span>
      </div>

      <div class="form-group">
        <label>Marca e Modello *</label>
        <input type="text" id="car-name" placeholder="Es. Dacia Sandero, Renault Kadjar..." required oninput="autoDetectCar(this.value)">
      </div>

      <div class="row-2">
        <div class="form-group">
          <label>Sagoma / Carrozzeria</label>
          <select id="car-shape" onchange="updateCarPreview()">
            <option value="sandero">Dacia Sandero (Berlina 5p)</option>
            <option value="kadjar">Renault Kadjar (SUV)</option>
            <option value="berlina">Berlina / Hatchback</option>
            <option value="suv">SUV / Crossover</option>
            <option value="sw">Station Wagon</option>
            <option value="citycar">Citycar</option>
          </select>
        </div>
        <div class="form-group">
          <label>Targa</label>
          <input type="text" id="car-plate" placeholder="AB 123 CD" style="text-transform:uppercase;">
        </div>
      </div>

      <div class="form-group">
        <label>Colore Carrozzeria</label>
        <div class="swatches" id="color-swatches"></div>
        <input type="hidden" id="car-color" value="#f8fafc">
      </div>

      <div class="row-2">
        <div class="form-group">
          <label>Chilometri Attuali *</label>
          <input type="number" id="car-km" placeholder="Es. 65000" required min="0">
        </div>
        <div class="form-group">
          <label>Anno Immatricolazione</label>
          <input type="number" id="car-year" placeholder="Es. 2021" min="1970" max="2030">
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-block">Salva Veicolo</button>
    </form>
  </div>
</div>

<!-- MODAL SCADENZA -->
<div class="modal-backdrop" id="modal-deadline">
  <div class="modal">
    <div class="modal-head">
      <h3 id="modal-deadline-title">Nuova Scadenza</h3>
      <button class="close-btn" onclick="closeModal('modal-deadline')">&times;</button>
    </div>
    <form id="form-deadline" onsubmit="saveDeadline(event)">
      <input type="hidden" id="dl-id">
      <div class="form-group">
        <label>Tipo Scadenza *</label>
        <select id="dl-type" onchange="onDeadlineTypeChange()">
          <option value="Revisione Ministeriale">Revisione Ministeriale</option>
          <option value="Tagliando / Cambio Olio">Tagliando / Cambio Olio</option>
          <option value="Assicurazione RCA">Assicurazione RCA</option>
          <option value="Bollo Auto">Bollo Auto</option>
          <option value="Inversione / Cambio Gomme">Inversione / Cambio Gomme</option>
          <option value="Altro">Altro promemoria</option>
        </select>
      </div>
      <div class="form-group" id="dl-custom-group" style="display:none;">
        <label>Nome Scadenza *</label>
        <input type="text" id="dl-custom-name" placeholder="Es. Cinghia distribuzione">
      </div>
      <div class="row-2">
        <div class="form-group">
          <label>Data Scadenza</label>
          <input type="date" id="dl-date">
        </div>
        <div class="form-group">
          <label>Oppure a Km</label>
          <input type="number" id="dl-km" placeholder="Es. 80000" min="0">
        </div>
      </div>
      <div class="form-group">
        <label>Note</label>
        <input type="text" id="dl-notes" placeholder="Es. Ogni 2 anni o 15.000 km">
      </div>
      <button type="submit" class="btn btn-primary btn-block">Salva Scadenza</button>
    </form>
  </div>
</div>

<!-- MODAL MANUTENZIONE -->
<div class="modal-backdrop" id="modal-maint">
  <div class="modal">
    <div class="modal-head">
      <h3>Registra Intervento</h3>
      <button class="close-btn" onclick="closeModal('modal-maint')">&times;</button>
    </div>
    <form id="form-maint" onsubmit="saveMaint(event)">
      <div class="form-group">
        <label>Intervento Eseguito *</label>
        <input type="text" id="m-title" placeholder="Es. Tagliando completo, Pastiglie freni..." required>
      </div>
      <div class="row-2">
        <div class="form-group">
          <label>Data *</label>
          <input type="date" id="m-date" required>
        </div>
        <div class="form-group">
          <label>Chilometri *</label>
          <input type="number" id="m-km" required min="0">
        </div>
      </div>
      <div class="row-2">
        <div class="form-group">
          <label>Categoria</label>
          <select id="m-cat">
            <option value="Tagliando">Tagliando / Olio</option>
            <option value="Freni">Freni</option>
            <option value="Gomme">Pneumatici</option>
            <option value="Revisione">Revisione</option>
            <option value="Meccanica">Meccanica / Altro</option>
          </select>
        </div>
        <div class="form-group">
          <label>Costo (€)</label>
          <input type="number" id="m-cost" step="0.01" placeholder="0.00" min="0">
        </div>
      </div>
      <div class="form-group">
        <label>Officina / Note</label>
        <textarea id="m-notes" rows="2" placeholder="Dettagli ricambi, olio usato, officina..."></textarea>
      </div>
      <div class="form-group">
        <label>Foto Fattura / Ricevuta (opzionale)</label>
        <input type="file" id="m-photo" accept="image/*" onchange="handlePhoto(event)">
        <input type="hidden" id="m-photo-data">
      </div>
      <button type="submit" class="btn btn-primary btn-block">Salva nel Libretto</button>
    </form>
  </div>
</div>

<!-- MODAL AGGIORNA KM -->
<div class="modal-backdrop" id="modal-km">
  <div class="modal">
    <div class="modal-head">
      <h3>Aggiorna Chilometri</h3>
      <button class="close-btn" onclick="closeModal('modal-km')">&times;</button>
    </div>
    <form onsubmit="saveQuickKm(event)">
      <div class="form-group">
        <label>Nuovo chilometraggio attuale</label>
        <input type="number" id="quick-km-input" required min="0" style="font-size:20px; font-weight:800;">
      </div>
      <button type="submit" class="btn btn-primary btn-block">Aggiorna</button>
    </form>
  </div>
</div>

<script>
const STORAGE_KEY = 'libretto_auto_v3';
let state = { cars: [], selectedCarId: null, activeTab: 'deadlines' };

const COLORS = [
  { name: 'Bianco Ghiaccio', hex: '#f8fafc' },
  { name: 'Grigio Titanio', hex: '#717882' },
  { name: 'Argento Metallizzato', hex: '#cbd5e1' },
  { name: 'Nero Nacré', hex: '#1f2937' },
  { name: 'Blu Iron', hex: '#1d4ed8' },
  { name: 'Rosso Fusion', hex: '#dc2626' },
  { name: 'Verde Cedro', hex: '#3f6212' },
  { name: 'Beige Sabbia', hex: '#d6c7b2' }
];

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (Array.isArray(parsed.cars)) state.cars = parsed.cars;
    }
  } catch (e) { console.error(e); }
}

function persist() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify({ cars: state.cars }));
}

function getShade(hex) {
  const c = hex.replace('#','');
  const r = Math.max(0, parseInt(c.substr(0,2),16) - 28);
  const g = Math.max(0, parseInt(c.substr(2,2),16) - 28);
  const b = Math.max(0, parseInt(c.substr(4,2),16) - 28);
  return `rgb(${r},${g},${b})`;
}

function isLightColor(hex) {
  const c = hex.replace('#','');
  const r = parseInt(c.substr(0,2),16);
  const g = parseInt(c.substr(2,2),16);
  const b = parseInt(c.substr(4,2),16);
  return (r*299 + g*587 + b*114)/1000 > 185;
}

function getCarSVG(shape, color) {
  const shade = getShade(color);
  const stroke = isLightColor(color) ? '#94a3b8' : '#1e293b';
  const uid = 'g_' + Math.random().toString(36).slice(2,7);

  // Wheel helper (front right at x=212, rear left at x=68)
  const wheels = (ry = 92, r = 21) => `
    <g>
      <circle cx="68" cy="${ry}" r="${r}" fill="#18181b"/>
      <circle cx="68" cy="${ry}" r="${r*0.64}" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
      <circle cx="68" cy="${ry}" r="${r*0.22}" fill="#334155"/>
      <line x1="68" y1="${ry-r*0.6}" x2="68" y2="${ry+r*0.6}" stroke="#64748b" stroke-width="2"/>
      <line x1="${68-r*0.6}" y1="${ry}" x2="${68+r*0.6}" y2="${ry}" stroke="#64748b" stroke-width="2"/>

      <circle cx="212" cy="${ry}" r="${r}" fill="#18181b"/>
      <circle cx="212" cy="${ry}" r="${r*0.64}" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
      <circle cx="212" cy="${ry}" r="${r*0.22}" fill="#334155"/>
      <line x1="212" y1="${ry-r*0.6}" x2="212" y2="${ry+r*0.6}" stroke="#64748b" stroke-width="2"/>
      <line x1="${212-r*0.6}" y1="${ry}" x2="${212+r*0.6}" y2="${ry}" stroke="#64748b" stroke-width="2"/>
    </g>`;

  // 1. DACIA SANDERO (Berlina 5p moderna, senza barre sul tetto, firma LED a Y)
  if (shape === 'sandero') {
    return `<svg viewBox="0 0 280 120" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="${uid}" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="${color}"/>
          <stop offset="100%" stop-color="${shade}"/>
        </linearGradient>
      </defs>
      <ellipse cx="140" cy="113" rx="115" ry="4.5" fill="rgba(15,23,42,0.14)"/>
      <!-- Scocca berlina 5 porte senza barre -->
      <path d="M 32 88 L 28 73 C 28 63, 33 53, 41 46 L 68 27 C 82 22, 118 21, 148 23 C 166 25, 184 37, 200 49 L 244 55 C 254 57, 259 64, 259 75 L 257 88 L 236 90 C 236 74, 188 74, 188 90 L 92 90 C 92 74, 44 74, 44 90 Z"
            fill="url(#${uid})" stroke="${stroke}" stroke-width="1.6" stroke-linejoin="round"/>
      <!-- Finestrini laterali con 3° vetro triangolare -->
      <path d="M 48 47 L 72 30 C 85 26, 114 25, 134 26 L 134 48 L 46 49 Z" fill="#1e293b"/>
      <path d="M 140 26 C 158 27, 174 36, 190 48 L 140 48 Z" fill="#1e293b"/>
      <!-- Montante B -->
      <rect x="134" y="25" width="6" height="24" fill="#0f172a"/>
      <!-- Linea di cintura e nervatura fiancata Sandero -->
      <path d="M 44 51 L 196 51" stroke="${stroke}" stroke-width="1" opacity="0.6"/>
      <path d="M 96 76 L 184 76" stroke="${stroke}" stroke-width="1.2" opacity="0.45"/>
      <!-- Maniglie -->
      <rect x="104" y="55" width="11" height="3" rx="1.5" fill="${stroke}"/>
      <rect x="148" y="55" width="11" height="3" rx="1.5" fill="${stroke}"/>
      <!-- Specchietto -->
      <path d="M 183 47 L 193 45 L 194 52 L 183 52 Z" fill="${color}" stroke="${stroke}" stroke-width="1.2"/>
      <!-- Faro anteriore con firma LED a Y -->
      <path d="M 241 56 L 257 60 L 255 67 L 239 63 Z" fill="#f8fafc" stroke="#64748b" stroke-width="1"/>
      <path d="M 243 60 L 251 62 M 251 62 L 255 59 M 251 62 L 254 65" stroke="#0284c7" stroke-width="1.6" stroke-linecap="round"/>
      <!-- Fanale posteriore -->
      <path d="M 30 55 L 42 54 L 40 64 L 29 64 Z" fill="#dc2626"/>
      <!-- Inserto paraurti anteriore -->
      <path d="M 246 77 L 258 77 L 257 86 L 244 86 Z" fill="#1e293b"/>
      ${wheels(91, 20.5)}
    </svg>`;
  }

  // 2. RENAULT KADJAR (SUV medio muscoloso, firma LED a C, protezioni sottoscocca, barre integrate)
  if (shape === 'kadjar') {
    return `<svg viewBox="0 0 280 120" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="${uid}" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="${color}"/>
          <stop offset="100%" stop-color="${shade}"/>
        </linearGradient>
      </defs>
      <ellipse cx="140" cy="114" rx="118" ry="4.5" fill="rgba(15,23,42,0.16)"/>
      <!-- Barre tetto integrate -->
      <path d="M 62 21 Q 115 17 166 21" fill="none" stroke="#cbd5e1" stroke-width="2.6" stroke-linecap="round"/>
      <!-- Scocca SUV muscolosa -->
      <path d="M 26 86 L 24 68 C 24 57, 29 48, 37 41 L 60 22 C 82 18, 132 18, 164 22 C 180 25, 194 37, 207 47 L 247 51 C 257 53, 262 61, 262 73 L 260 87 L 238 89 C 238 71, 186 71, 186 89 L 94 89 C 94 71, 42 71, 42 89 Z"
            fill="url(#${uid})" stroke="${stroke}" stroke-width="1.6" stroke-linejoin="round"/>
      <!-- Passaruota neri SUV + fascia sottoscocca con inserto cromato -->
      <path d="M 40 89 C 40 69, 96 69, 96 89" fill="none" stroke="#1e293b" stroke-width="4.5"/>

function getDeadlineStatus(dl, currentKm) {
  let worst = { level: 'ok', text: 'In regola' };
  const today = new Date(); today.setHours(0,0,0,0);

  if (dl.date) {
    const target = new Date(dl.date);
    const diffDays = Math.ceil((target - today) / (1000 * 60 * 60 * 24));
    if (diffDays < 0) return { level: 'bad', text: `Scaduta da ${Math.abs(diffDays)} gg` };
    if (diffDays <= 30) worst = { level: 'warn', text: `Tra ${diffDays} gg` };
    else worst = { level: 'ok', text: new Date(dl.date).toLocaleDateString('it-IT') };
  }

  if (dl.km && currentKm !== undefined) {
    const diffKm = dl.km - currentKm;
    if (diffKm <= 0) return { level: 'bad', text: `Superata di ${Math.abs(diffKm).toLocaleString('it-IT')} km` };
    if (diffKm <= 1500 && worst.level !== 'bad') {
      worst = { level: 'warn', text: `Tra ${diffKm.toLocaleString('it-IT')} km` };
    } else if (!dl.date) {
      worst = { level: 'ok', text: `A ${Number(dl.km).toLocaleString('it-IT')} km` };
    }
  }
  return worst;
}

function getCarSummaryBadge(car) {
  if (!car.deadlines || car.deadlines.length === 0) {
    return `<span class="badge badge-ok">Nessuna scadenza</span>`;
  }
  let hasBad = 0, hasWarn = 0;
  car.deadlines.forEach(d => {
    const st = getDeadlineStatus(d, car.km);
    if (st.level === 'bad') hasBad++;
    else if (st.level === 'warn') hasWarn++;
  });
  if (hasBad > 0) return `<span class="badge badge-bad">${hasBad} scadut${hasBad>1?'e':'a'}</span>`;
  if (hasWarn > 0) return `<span class="badge badge-warn">${hasWarn} in scadenza</span>`;
  return `<span class="badge badge-ok">Tutto in regola</span>`;
}

function renderPlate(plate) {
  if (!plate) return '';
  return `<div class="plate"><div class="plate-band"><span>I</span></div><div class="plate-num">${escapeHtml(plate)}</div></div>`;
}

function escapeHtml(str) {
  return String(str || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

            </div>

            <span style="font-weight:700;">${Number(car.km).toLocaleString('it-IT')} km</span>

        </div>

        <div class="backup-bar">
          <button class="btn btn-ghost btn-sm" onclick="exportBackup()">📤 Esporta Backup</button>
          <button class="btn btn-ghost btn-sm" onclick="triggerImport()">📥 Importa Backup</button>
          <input type="file" id="import-file" accept=".json" style="display:none" onchange="importBackup(event)">
        </div>

      <button class="btn btn-ghost" onclick="backToGarage()">‹ Garage</button>
      <div style="font-weight:800; font-size:16px;">${escapeHtml(car.name)}</div>
      <button class="btn btn-ghost btn-sm" onclick="openCarModal('${car.id}')">Modifica</button>
    `;

        <div class="hero-avatar">${getCarSVG(car.shape, car.color)}</div>
        <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px;">
          <div>
            <div style="font-size:20px; font-weight:800;">${escapeHtml(car.name)}</div>

          <h3>Scadenze & Controlli</h3>
          <button class="btn btn-primary btn-sm" onclick="openDeadlineModal()">+ Scadenza</button>

        html += `<div class="item-card" style="text-align:center; color:var(--muted); padding:26px;">Nessuna scadenza impostata.<br>Aggiungi revisione, bollo, assicurazione o tagliando.</div>`;
      } else {
        html += car.deadlines.map(dl => {
          const st = getDeadlineStatus(dl, car.km);
          return `
            <div class="item-card">
              <div class="item-row">
                <div>
                  <div class="item-title">${escapeHtml(dl.title)}</div>
                  <div class="item-meta">
                    ${dl.date ? 'Data: ' + new Date(dl.date).toLocaleDateString('it-IT') : ''}
                    ${dl.date && dl.km ? ' • ' : ''}
                    ${dl.km ? 'Soglia: ' + Number(dl.km).toLocaleString('it-IT') + ' km' : ''}
                  </div>
                  ${dl.notes ? `<div class="item-meta" style="margin-top:3px;">${escapeHtml(dl.notes)}</div>` : ''}
                </div>
                <span class="badge badge-${st.level}">${st.text}</span>

        html += `<div class="item-card" style="text-align:center; color:var(--muted); padding:26px;">Nessun intervento registrato.<br>Salva qui tagliandi, cambi gomme e riparazioni.</div>`;

          <div class="item-card">
            <div class="item-row">

              <button class="btn btn-danger btn-sm" onclick="deleteMaint('${m.id}')">Elimina</button>
            </div>
          </div>

    }

    html += `
      <div style="margin-top:32px; text-align:center;">
        <button class="btn btn-danger btn-sm" onclick="deleteCar('${car.id}')">Elimina questo veicolo</button>
      </div>

    main.innerHTML = html;
  }
}

/* Navigation */
function selectCar(id) { state.selectedCarId = id; state.activeTab = 'deadlines'; render(); window.scrollTo(0,0); }
function backToGarage() { state.selectedCarId = null; render(); window.scrollTo(0,0); }
function switchTab(t) { state.activeTab = t; render(); }

/* Modals */
function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

function renderSwatches(selectedHex) {
  const box = document.getElementById('color-swatches');
  box.innerHTML = COLORS.map(c => `
    <div class="swatch ${c.hex.toLowerCase()===selectedHex.toLowerCase()?'selected':''}"
         style="background:${c.hex};" title="${c.name}"
         onclick="selectColor('${c.hex}')"></div>
  `).join('');
}

function selectColor(hex) {
  document.getElementById('car-color').value = hex;
  renderSwatches(hex);
  updateCarPreview();
}

function updateCarPreview() {
  const shape = document.getElementById('car-shape').value;
  const color = document.getElementById('car-color').value;
  document.getElementById('car-svg-preview').innerHTML = getCarSVG(shape, color);
}

function autoDetectCar(val) {
  const v = val.toLowerCase();
  if (v.includes('sandero')) {
    document.getElementById('car-shape').value = 'sandero';
    selectColor('#f8fafc');
  } else if (v.includes('kadjar')) {
    document.getElementById('car-shape').value = 'kadjar';
    selectColor('#717882');
  }
}

function openCarModal(editId = null) {
  document.getElementById('form-car').reset();
  if (editId) {
    const car = state.cars.find(c => c.id === editId);
    document.getElementById('modal-car-title').textContent = 'Modifica Veicolo';
    document.getElementById('car-id').value = car.id;
    document.getElementById('car-name').value = car.name;
    document.getElementById('car-shape').value = car.shape || 'sandero';
    document.getElementById('car-plate').value = car.plate || '';
    document.getElementById('car-km').value = car.km;
    document.getElementById('car-year').value = car.year || '';
    selectColor(car.color || '#f8fafc');
  } else {
    document.getElementById('modal-car-title').textContent = 'Aggiungi Auto';
    document.getElementById('car-id').value = '';
    document.getElementById('car-shape').value = 'sandero';
    selectColor('#f8fafc');
  }
  openModal('modal-car');
}

function saveCar(e) {
  e.preventDefault();
  const id = document.getElementById('car-id').value;
  const data = {
    name: document.getElementById('car-name').value.trim(),
    shape: document.getElementById('car-shape').value,
    plate: document.getElementById('car-plate').value.trim().toUpperCase(),
    color: document.getElementById('car-color').value,
    km: parseInt(document.getElementById('car-km').value, 10) || 0,
    year: document.getElementById('car-year').value.trim()
  };

  if (id) {
    const idx = state.cars.findIndex(c => c.id === id);
    if (idx > -1) state.cars[idx] = { ...state.cars[idx], ...data };
  } else {
    state.cars.push({
      id: 'car_' + Date.now(),
      ...data,
      deadlines: [],
      maintenances: []
    });
  }
  persist();
  closeModal('modal-car');
  render();
}

function deleteCar(id) {
  if (!confirm('Eliminare definitivamente questo veicolo e tutto il suo storico?')) return;
  state.cars = state.cars.filter(c => c.id !== id);
  state.selectedCarId = null;
  persist();
  render();
}

/* Quick Km */
function openQuickKm() {
  const car = state.cars.find(c => c.id === state.selectedCarId);
  document.getElementById('quick-km-input').value = car.km;
  openModal('modal-km');
}
function saveQuickKm(e) {
  e.preventDefault();
  const car = state.cars.find(c => c.id === state.selectedCarId);
  car.km = parseInt(document.getElementById('quick-km-input').value, 10) || car.km;
  persist();
  closeModal('modal-km');
  render();
}

/* Deadlines */
function onDeadlineTypeChange() {
  const val = document.getElementById('dl-type').value;
  document.getElementById('dl-custom-group').style.display = val === 'Altro' ? 'block' : 'none';
}
function openDeadlineModal() {
  document.getElementById('form-deadline').reset();
  onDeadlineTypeChange();
  openModal('modal-deadline');
}
function saveDeadline(e) {
  e.preventDefault();
  const car = state.cars.find(c => c.id === state.selectedCarId);
  const type = document.getElementById('dl-type').value;
  const title = type === 'Altro' ? (document.getElementById('dl-custom-name').value.trim() || 'Promemoria') : type;
  const date = document.getElementById('dl-date').value;
  const kmVal = document.getElementById('dl-km').value;
  if (!date && !kmVal) { alert('Inserisci almeno una data o un chilometraggio.'); return; }

  car.deadlines = car.deadlines || [];
  car.deadlines.push({
    id: 'dl_' + Date.now(),
    title,
    date: date || null,
    km: kmVal ? parseInt(kmVal, 10) : null,
    notes: document.getElementById('dl-notes').value.trim()
  });
  persist();
  closeModal('modal-deadline');
  render();
}
function renewDeadline(dlId) {
  const car = state.cars.find(c => c.id === state.selectedCarId);
  const dl = car.deadlines.find(d => d.id === dlId);
  if (!dl) return;
  if (dl.date) {
    const d = new Date(dl.date);
    const years = dl.title.toLowerCase().includes('revisione') ? 2 : 1;
    d.setFullYear(d.getFullYear() + years);
    dl.date = d.toISOString().split('T')[0];
  }
  if (dl.km) {
    dl.km = car.km + 15000;
  }
  persist();
  render();
}
function deleteDeadline(dlId) {
  const car = state.cars.find(c => c.id === state.selectedCarId);
  car.deadlines = car.deadlines.filter(d => d.id !== dlId);
  persist();
  render();
}

/* Maintenance */
function openMaintModal() {
  const car = state.cars.find(c => c.id === state.selectedCarId);
  document.getElementById('form-maint').reset();
  document.getElementById('m-date').value = new Date().toISOString().split('T')[0];
  document.getElementById('m-km').value = car.km;
  document.getElementById('m-photo-data').value = '';
  openModal('modal-maint');
}

function handlePhoto(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    const img = new Image();
    img.onload = function() {
      const canvas = document.createElement('canvas');
      const maxW = 800;
      const scale = Math.min(1, maxW / img.width);
      canvas.width = img.width * scale;
      canvas.height = img.height * scale;
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      document.getElementById('m-photo-data').value = canvas.toDataURL('image/jpeg', 0.65);
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

function saveMaint(e) {
  e.preventDefault();
  const car = state.cars.find(c => c.id === state.selectedCarId);
  const km = parseInt(document.getElementById('m-km').value, 10) || car.km;
  if (km > car.km) car.km = km;

  car.maintenances = car.maintenances || [];
  car.maintenances.push({
    id: 'm_' + Date.now(),
    title: document.getElementById('m-title').value.trim(),
    date: document.getElementById('m-date').value,
    km,
    category: document.getElementById('m-cat').value,
    cost: document.getElementById('m-cost').value,
    notes: document.getElementById('m-notes').value.trim(),
    photo: document.getElementById('m-photo-data').value || null
  });
  persist();
  closeModal('modal-maint');
  render();
}

function deleteMaint(mId) {
  const car = state.cars.find(c => c.id === state.selectedCarId);
  car.maintenances = car.maintenances.filter(m => m.id !== mId);
  persist();
  render();
}

/* Backup */
function exportBackup() {
  const blob = new Blob([JSON.stringify(state.cars, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `libretto-auto-backup-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
}
function triggerImport() { document.getElementById('import-file').click(); }
function importBackup(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const data = JSON.parse(ev.target.result);
      if (Array.isArray(data)) {
        state.cars = data;
        persist();
        render();
        alert('Backup ripristinato con successo!');
      }
    } catch { alert('File di backup non valido.'); }
  };
  reader.readAsText(file);
}

loadState();
render();
</script>
</body>
</html>
